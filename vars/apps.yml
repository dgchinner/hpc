__hpc_lib_zoltan_info:
  name: zoltan
  version: "3.90"
  sha256: 30a470af4d97cf03aa5434eb0a095f627a3a8096ecdb17f4f6b9ce58e832d28b
  url: https://github.com/sandialabs/Zoltan/archive/refs/tags/v3.90.tar.gz

# Registry of buildable library packages, keyed by dependency name. An
# application declares its dependencies by name (see the *_dependencies
# lists below); each name resolves to an entry here that describes how to
# build the library as an RPM:
#   rpm      - the RPM package name (used for the rpm -q idempotence check)
#   spec     - spec file under files/{{ __hpc_apps_spec_dir }}/
#   info     - source package dict (name, version, sha256, url)
#   needs_mpi - whether the build must load the MPI environment module
__hpc_lib_packages:
  gklib:
    rpm: hpc-gklib
    spec: hpc-gklib.spec
    info: "{{ __hpc_lib_gklib_info }}"
    needs_mpi: false
  scotch:
    rpm: hpc-scotch
    spec: hpc-scotch.spec
    info: "{{ __hpc_lib_scotch_info }}"
    needs_mpi: true
  metis:
    rpm: hpc-metis
    spec: hpc-metis.spec
    info: "{{ __hpc_lib_metis_info }}"
    needs_mpi: false

# --- OpenFOAM-13 application ---

# Libraries that must be built and installed as RPMs before OpenFOAM-13
# can be built. Listed in build (dependency) order; each name must resolve
# to an entry in __hpc_lib_packages.
__hpc_openfoam_dependencies:
  - gklib
  - scotch
  - metis

__hpc_openfoam_path: "{{ __hpc_apps_prefix }}/OpenFOAM-13"

__hpc_openfoam_build_dependencies:
  - gcc
  - gcc-c++
  - gcc-gfortran
  - make
  - cmake
  - flex
  - bison
  - boost-devel
  - zlib-devel
  - bzip2-devel
  - rpm-build
  - rpmdevtools

