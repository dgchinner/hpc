  version: "6.0.9"
  sha256: b9bc86c50b65781eb416663e938d57555373c2517ea8b9acf680fd3acde0cb0c
  url: https://gitlab.inria.fr/scotch/scotch/-/archive/v6.0.9/scotch-v6.0.9.tar.gz

__hpc_lib_metis_info:
