# SPDX-License-Identifier: MIT
#
# Application-layer internal variables, kept separate from base HPC
# environment variables.
---

# Shared prefix for HPC application and library installations.
# Follows FHS layout: bin/, lib/, include/, share/, share/man/
__hpc_apps_prefix: /opt/hpc

# Scratch directory for building the HPC applications and libraries. The
# OpenFOAM build tree is large; /var/tmp is disk-backed, whereas /tmp is often
# a small tmpfs (RAM) that runs out of space during the build.
__hpc_apps_build_tmpdir: /var/tmp

# Directory under files/ holding the RPM spec files for the HPC
# library and application builds.
__hpc_apps_spec_dir: openfoam

# --- Shared HPC libraries ---

# GKlib is required to build METIS and ParMETIS. It has no upstream version
# releases; this pins the commit METIS 5.2.1 was released against (the last
# GKlib commit before the METIS 5.2.1 release) and carries METIS's version.
__hpc_lib_gklib_info:
  name: gklib
  version: "5.2.1"
  sha256: e1d59de12336731e6dde8465f05de7b907fae5d72c921cffcde217a89eaab654
  url: https://github.com/KarypisLab/GKlib/archive/8bd6bad750b2b0d90800c632cf18e8ee93ad72d7.tar.gz

__hpc_lib_scotch_info:
